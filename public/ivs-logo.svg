<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <!-- Background transparent or dark -->
  <rect width="800" height="800" fill="transparent"/>
  
  <g transform="translate(100, 120)">
    <!-- Monogram IVS -->
    <!-- Letter I -->
    <path d="M 130 100 L 160 100 L 160 300 L 130 300 Z" fill="#FFFFFF" />
    
    <!-- Letter V (Vibrant Royal Blue) -->
    <path d="M 180 100 L 220 100 L 290 280 L 350 180 L 310 180 L 290 220 L 225 100 Z" fill="#0066FF" />
    
    <!-- Letter S -->
    <path d="M 330 100 L 460 100 L 460 145 L 375 145 C 360 145 350 155 350 170 C 350 185 360 195 385 200 L 420 208 C 455 216 470 235 470 260 C 470 290 445 305 400 305 L 310 305 L 310 260 L 400 260 C 415 260 425 252 425 240 C 425 228 415 220 395 215 L 360 207 C 325 198 310 180 310 150 C 310 120 335 100 330 100 Z" fill="#FFFFFF" />
  </g>

  <!-- Text: IVS WORKS -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="12" fill="#FFFFFF">
      IVS <tspan fill="#0066FF">WORKS</tspan>
    </text>
  </g>

  <!-- Tagline: DESARROLLAMOS SOLUCIONES, CREAMOS FUTURO -->
  <g transform="translate(400, 570)" text-anchor="middle">
    <!-- Left Accent Line -->
    <line x1="-280" y1="-5" x2="-200" y2="-5" stroke="#0066FF" stroke-width="2" />
    <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="13" letter-spacing="3.5" fill="#A1A1AA">
      DESARROLLAMOS SOLUCIONES, CREAMOS FUTURO
    </text>
    <!-- Right Accent Line -->
    <line x1="200" y1="-5" x2="280" y2="-5" stroke="#0066FF" stroke-width="2" />
  </g>
</svg>
